manifestVersion: 1.1
id: tyger-datum
category: bitcoin
name: Tyger DATUM
version: "v0.4.1-beta-5-tyger.1"
icon: https://tygerpool.com/logo.svg
tagline: Pool-mine BLAKE2b Bitcoin on DATUM — you build the blocks, paid straight to your wallet
description: >-
  Mine on Tyger Pool the sovereign way. This app runs a DATUM gateway on your Umbrel, connected to
  your own Bitcoin Knots node, so YOU build your own block templates — nobody picks your transactions
  for you. Every block the pool finds pays you directly in the block's coinbase, to your own address.
  Tyger never holds your coins.


  Tyger Pool is DATUM-only by conviction: no stratum port, no custodial balance, no "trust us".
  One-click app, pre-set for Tyger — the only thing you type is your payout address. Built on Retropex's DATUM image (thank you, Retropex).
  CURRENT BUILD runs in SOLO mode (a solo block pays your address 100%). The pool-mode update ships as a normal app update once the payout-fix gateway build is in the app image.


  🛠️ SET-UP (three things)


  ### 1. Your node
  This app connects automatically to your Bitcoin Knots app. Knots must be on the BIP-110 / BLAKE2b
  version (Umbrel's Bitcoin Knots app, v29.4 or later). Pruning is fine.


  ### 2. Your payout address
  Open this app → "Config" tab → put your bc1… address in "pool_address" → Save. That is the address
  every block pays. The in-app login is under right-click the app icon → "Show default credentials".
  (Safari can't edit the config — use another browser.)


  ### 3. Your miner
  In your miner's pool settings:

    - URL: stratum+tcp://YOUR-UMBREL-IP:23341   (your Umbrel's IP is under Settings)

    - Worker / username: anything, e.g. rig1 — it's just a label; your Config address decides where
      the coins go.

    - Password: anything.


  Check it's working: this app's page shows "Connected" to the pool and your miner's hashrate.
  Stuck? Tyger Discord → https://discord.gg/BVD4EHuPCT (drops you in #getting-started).
developer: Tyger Pool
website: https://tygerpool.com
dependencies:
  - bitcoin-knots
repo: https://github.com/innerhat-dev/datum_gateway
support: https://discord.gg/BVD4EHuPCT
port: 21011
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/datum/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/datum/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/datum/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  Pool mode live, on Tyger's own gateway image with the payout-coinbase fix (innerhat 4cd17a0). 0% launch fee.
