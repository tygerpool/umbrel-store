name: Build gateway image
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/tygerpool/datum-gateway:4cd17a0
      - name: Smoke test — container starts and prints usage/version
        run: |
          out=$(docker run --rm ghcr.io/tygerpool/datum-gateway:4cd17a0 ./datum_gateway --help 2>&1 || true)
          echo "$out" | head -20
          echo "$out" | grep -qiE "usage|datum|config" || { echo "smoke test failed"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tygerpool/datum-gateway:4cd17a0
